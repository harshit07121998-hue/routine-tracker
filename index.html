<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><link rel="manifest" href="manifest.webmanifest"><title>Routine Tracker</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17203a;background:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fc,#fff 72%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:20px 15px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#1769ff;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}.brand h1{font-size:20px;margin:0}.date{font-size:13px;color:#778198;margin:3px 0 0}.logout{padding:10px 13px;border:1px solid #e1e6ef;border-radius:11px;background:#fff;color:#34405a;font-weight:650}.hero{margin-bottom:18px}.hero h2{font-size:27px;margin:0}.hero p{color:#6b768c;margin-top:5px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:19px;padding:16px;box-shadow:0 8px 28px rgba(31,49,79,.055)}.label{color:#657089;font-size:13px;font-weight:650}.big{font-size:28px;font-weight:800;margin-top:7px}.sub{color:#7a8497;font-size:12px;margin-top:4px}.purple{color:#7542ee}.person{min-height:166px;text-align:left;width:100%;border:1px solid #e5eaf2}.person-top,.score-row,.average-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.person-name{font-size:19px;font-weight:780}.you{font-size:10px;padding:5px 8px;border-radius:99px;background:#eef5ff;color:#1769ff;font-weight:750}.score{font-size:30px;font-weight:850;margin-top:8px}.sticker{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;font-size:43px}.boy{background:#e7f1ff}.girl{background:#fae7f7}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#1769ff;border-radius:99px}.friendfill{background:#8a4cf4}.note{font-size:12px;color:#7a8497;margin-top:4px}.average{grid-column:1/-1}.avg{font-size:33px;font-weight:850;margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.mini{padding:11px 12px;border-radius:14px;background:#f7f9fc;border:1px solid #edf0f5}.mini span{display:block;font-size:21px;font-weight:850;margin-top:2px}.quote{margin-top:13px;padding:21px 18px;background:linear-gradient(135deg,#edf5ff,#fff);border:1px solid #dce8fa;border-radius:19px}.quote p{font-size:16px;line-height:1.5;font-weight:680;margin:0}.quote small{display:block;color:#6c7890;margin-top:7px}.status{min-height:18px;text-align:center;color:#b42318;font-size:13px;margin-top:10px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:100%;max-width:390px}.field{display:grid;gap:7px;margin:13px 0}.field span{font-size:13px;font-weight:650;color:#526078}.field input,.field select{height:48px;border:1px solid #dce2eb;border-radius:12px;padding:0 13px;background:#fff}.login-btn{width:100%;height:48px;border:0;border-radius:12px;background:#1769ff;color:#fff;font-weight:700}.error{color:#b42318;font-size:13px;margin-top:10px;min-height:18px}.modal{display:none;position:fixed;inset:0;background:rgba(17,27,48,.4);padding:15px;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:620px;background:#fff;border-radius:24px 24px 16px 16px;padding:18px 16px 22px;max-height:90vh;overflow:auto}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheettitle{font-size:21px;font-weight:800}.close{width:38px;height:38px;border:0;border-radius:50%;background:#f2f4f7;font-size:20px}.routine{display:flex;align-items:center;gap:11px;padding:13px 10px;border-bottom:1px solid #edf0f4}.routine:last-child{border-bottom:0}.rname{flex:1;min-width:0}.rname strong{display:block;font-size:15px}.rname small{display:block;color:#7a8497;font-size:11px;margin-top:3px}.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:850;flex:0 0 32px}.yellow{background:#fff1b8;color:#b77900}.green{background:#dff7eb;color:#07945f}.red{background:#ffe1e1;color:#d92d20}.plus{width:32px;height:32px;border:0;border-radius:9px;background:#f3f5f8;color:#536078;font-size:18px}.addbar{margin-top:14px}.addmain{width:100%;height:48px;border:0;border-radius:13px;background:#1769ff;color:#fff;font-weight:750}.hint{font-size:12px;color:#7a8497}.formgrid{display:grid;gap:12px;margin-top:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.legend{font-size:11px;color:#6d7890;margin-top:10px}.legend b{margin-right:10px}@media(max-width:520px){.app{padding:18px 13px 32px}.cards{gap:10px}.card{padding:14px}.person-name{font-size:17px}.sticker{width:60px;height:60px;font-size:39px}.score{font-size:27px}.formrow{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div>
<div class="modal" id="routineModal"><section class="sheet"><div class="sheethead"><div><div class="sheettitle" id="sheetTitle">Routines</div><div class="date" id="sheetDate"></div></div><button class="close" id="closeModal">×</button></div><div id="routineList"></div><div class="legend"><b>🟡 Pending</b><b>🟢 Done</b><b>🔴 Missed</b></div></section></div>
<div class="modal" id="addModal"><section class="sheet"><div class="sheethead"><div class="sheettitle">Add Routine</div><button class="close" id="closeAdd">×</button></div><p class="hint" style="margin-top:4px">Create a daily routine and choose who it applies to.</p><form id="addForm" class="formgrid"><label class="field"><span>Task</span><input id="taskName" maxlength="80" required placeholder="e.g. Drink water"></label><div class="formrow"><label class="field"><span>Frequency</span><select id="frequency"><option value="daily">Daily</option></select></label><label class="field"><span># of times / day</span><input id="times" type="number" min="1" max="20" value="1" required></label></div><label class="field"><span>Applicable on</span><select id="applicable"><option value="harshit">Harshit only</option><option value="sapana">Sapana only</option><option value="both">Both</option></select></label><button class="addmain" type="submit">Add Routine</button><p class="error" id="addError"></p></form></section></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from"./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),root=document.getElementById('root');const USERS={Harshit:{email:'harshit@routine.app'},Sapana:{email:'sapana@routine.app'}};let session=null,profile=null,friendId=null,tasks=[],logs=[];const today=new Date().toISOString().slice(0,10),start=new Date();start.setDate(start.getDate()-9);const tenAgo=start.toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
function loginScreen(msg=''){root.innerHTML=`<main class="login-wrap"><section class="login"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">Private shared dashboard</p></div></div><div class="card" style="margin-top:20px"><label class="field"><span>User ID</span><input id="loginId" autocomplete="username"></label><label class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password"></label><button class="login-btn" id="loginBtn">Log in</button><p class="error" id="loginError">${esc(msg)}</p></div></section></main>`;loginBtn.onclick=login;loginPassword.onkeydown=e=>e.key==='Enter'&&login()}
async function login(){const id=loginId.value.trim(),pass=loginPassword.value;if(!USERS[id]){loginError.textContent='Use Harshit or Sapana.';return}loginBtn.disabled=true;const r=await supabase.auth.signInWithPassword({email:USERS[id].email,password:pass});if(r.error){loginError.textContent='Incorrect User ID or password.';loginBtn.disabled=false;return}await init()}
async function init(){const r=await supabase.auth.getSession();session=r.data.session;if(!session){loginScreen();return}render();await load()}
function render(){root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">${fmt(new Date())}</p></div></div><button class="logout" id="logout">Log out</button></header><section class="hero"><h2 id="hello">Good morning! 👋</h2><p>Your shared progress, at a glance.</p></section><section class="cards"><article class="card"><div class="label">Today</div><div class="big">${new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(new Date())}</div><div class="sub">Daily score snapshot</div></article><article class="card"><div class="label">10-Day Average</div><div class="avg purple" id="combined">0%</div><div class="sub">Combined average score</div></article><button class="card person" id="hCard"><div class="person-top"><span class="person-name">Harshit</span><span class="you" id="hYou" style="display:none">You</span></div><div class="score-row"><div><div class="score" id="hScore">0%</div><div class="note">Today's score · Tap for routines</div></div><div class="sticker boy">👦🏻</div></div><div class="progress"><div class="fill" id="hBar"></div></div></button><button class="card person" id="sCard"><div class="person-top"><span class="person-name">Sapana</span><span class="you" id="sYou" style="display:none">You</span></div><div class="score-row"><div><div class="score purple" id="sScore">0%</div><div class="note">Today's score · Tap for routines</div></div><div class="sticker girl">👧🏻</div></div><div class="progress"><div class="fill friendfill" id="sBar"></div></div></button><article class="card average"><div class="average-head"><div><div class="label">Last 10 Days Average Score</div><div class="date">${fmt(start)} – ${fmt(new Date())}</div></div><span style="font-size:27px">📈</span></div><div class="split"><div class="mini"><strong>Harshit</strong><span class="purple" id="hAvg">0%</span></div><div class="mini"><strong>Sapana</strong><span class="purple" id="sAvg">0%</span></div></div></article></section><div class="addbar"><button class="addmain" id="addRoutine">＋ Add Routine</button></div><section class="quote"><p>Small steps every day create remarkable results.</p><small>— Keep going. Consistency wins.</small></section><p class="status" id="status"></p></main>`;logout.onclick=async()=>{await supabase.auth.signOut();session=null;loginScreen()};hCard.onclick=()=>openRoutines('Harshit');sCard.onclick=()=>openRoutines('Sapana');addRoutine.onclick=()=>{addModal.classList.add('show');addError.textContent=''}}
async function load(){try{const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();profile=p.data;hello.textContent=`Good morning, ${profile?.display_name||'there'}! 👋`;const f=await supabase.from('friendships').select('user_id,friend_id').or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`).eq('status','accepted').maybeSingle();if(f.data)friendId=f.data.user_id===session.user.id?f.data.friend_id:f.data.user_id;const t=await supabase.from('tasks').select('*').order('created_at');tasks=t.data||[];const l=await supabase.from('daily_logs').select('*').gte('log_date',tenAgo).lte('log_date',today);logs=l.data||[];updateScores();showYou()}catch(e){status.textContent='Could not load data.'}}
function personId(name){const email=(session.user.email||'').toLowerCase();if(name==='Harshit'&&email==='harshit@routine.app')return session.user.id;if(name==='Sapana'&&email==='sapana@routine.app')return session.user.id;return friendId}
function applies(t,name){const a=String(t.applicable_to||'').toLowerCase();return a==='both'||a===name.toLowerCase()||a==='me'&&((session.user.email||'').toLowerCase().startsWith(name.toLowerCase()))||a==='friend'&&((session.user.email||'').toLowerCase().startsWith(name==='Harshit'?'sapana':'harshit'))}
function target(t){return Math.max(1,Number(t.target_quantity||1))}function qty(t,uid,date){const l=logs.find(x=>x.task_id===t.id&&x.user_id===uid&&x.log_date===date);return Math.max(0,Number(l?.quantity||0))}
function score(name,date){const uid=personId(name),list=tasks.filter(t=>uid&&applies(t,name));if(!list.length)return 0;let total=0;for(const t of list)total+=Math.min(qty(t,uid,date)/target(t),1);return Math.round(total/list.length*100)}function avg(name){let total=0;for(let i=0;i<10;i++){const d=new Date();d.setDate(d.getDate()-i);total+=score(name,d.toISOString().slice(0,10))}return Math.round(total/10)}
function updateScores(){const h=score('Harshit',today),s=score('Sapana',today);hScore.textContent=h+'%';sScore.textContent=s+'%';hBar.style.width=h+'%';sBar.style.width=s+'%';const ha=avg('Harshit'),sa=avg('Sapana');hAvg.textContent=ha+'%';sAvg.textContent=sa+'%';combined.textContent=Math.round((ha+sa)/2)+'%'}function showYou(){const e=(session.user.email||'').toLowerCase();if(e==='harshit@routine.app')hYou.style.display='inline-block';if(e==='sapana@routine.app')sYou.style.display='inline-block'}
function routineMeta(t){const n=target(t);return `Daily · ${n} ${n===1?'time':'times'} / day`}function statusFor(t,uid,date){const q=qty(t,uid,date),n=target(t);if(q>=n)return['green','✓'];if(date<today)return['red','×'];return['yellow','•']}
function openRoutines(name){const uid=personId(name);sheetTitle.textContent=`${name}'s Routines`;sheetDate.textContent=fmt(new Date());const list=tasks.filter(t=>uid&&applies(t,name));routineList.innerHTML=list.length?list.map(t=>{const[c,s]=statusFor(t,uid,today),q=qty(t,uid,today),n=target(t);return `<div class="routine"><div class="rname"><strong>${esc(t.name)}</strong><small>${routineMeta(t)} · ${q}/${n} completed today</small></div><span class="dot ${c}">${s}</span><button class="plus" data-id="${t.id}">+</button></div>`}).join(''):'<div class="hint" style="padding:25px;text-align:center">No routines assigned yet.</div>';routineModal.classList.add('show');routineList.querySelectorAll('.plus').forEach(b=>b.onclick=()=>completeOne(b.dataset.id,uid,name))}
async function completeOne(taskId,uid,name){const t=tasks.find(x=>x.id===taskId);if(!t)return;let q=qty(t,uid,today);q=q>=target(t)?0:q+1;const r=await supabase.from('daily_logs').upsert({task_id:taskId,user_id:uid,log_date:today,completed:q>=target(t),quantity:q},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){status.textContent=r.error.message;return}const i=logs.findIndex(x=>x.task_id===taskId&&x.user_id===uid&&x.log_date===today);if(i>=0)logs[i]=r.data;else logs.push(r.data);updateScores();openRoutines(name)}
async function addRoutineTask(e){e.preventDefault();const name=taskName.value.trim(),n=Math.max(1,Math.min(20,Number(times.value)||1)),who=applicable.value;if(!name){addError.textContent='Enter a task name.';return}const r=await supabase.from('tasks').insert({name,type:'checkbox',applicable_to:who,target_quantity:n,portion_size:null,created_by:session.user.id});if(r.error){addError.textContent=r.error.message;return}addModal.classList.remove('show');taskName.value='';times.value='1';const t=await supabase.from('tasks').select('*').order('created_at');tasks=t.data||[];updateScores()}
document.getElementById('closeModal').onclick=()=>routineModal.classList.remove('show');document.getElementById('closeAdd').onclick=()=>addModal.classList.remove('show');document.getElementById('addForm').onsubmit=addRoutineTask;init();
</script></body></html>
