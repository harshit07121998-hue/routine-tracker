<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Routine Tracker</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#fff}
    *{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:24px 16px 48px}
    h1,h2,p{margin:0}.muted{color:#667085}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
    button,input,select{font:inherit}button{min-height:44px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:0 14px;cursor:pointer}
    .primary{background:#17202a;color:#fff;border-color:#17202a}.card{border:1px solid #e4e7ec;border-radius:18px;padding:16px;margin-top:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:12px 0 7px}.fill{height:100%;background:#17202a;width:0}
    .task{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid #eef0f3}
    .task:last-child{border-bottom:0}.taskname{font-weight:600}.tag{font-size:12px;color:#667085;margin-top:3px}
    .done{background:#eef6ee;border-color:#b7d5b8}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);padding:24px;align-items:center;justify-content:center}.modal.show{display:flex}
    .modalbox{background:#fff;border-radius:18px;padding:18px;max-width:420px;width:100%}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 10px}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.task{grid-template-columns:minmax(0,1fr) auto}.task button:last-child{grid-column:2}.top{align-items:center}}
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <div><p class="muted">Today</p><h1>Routine Tracker</h1><p class="muted" id="who">Connecting…</p></div>
    <button id="addBtn">+ Add task</button>
  </div>
  <div class="grid">
    <section class="card"><strong>You</strong><strong style="float:right" id="myPct">0%</strong><div class="bar"><div class="fill" id="myBar"></div></div><small class="muted" id="myCount">0/0</small></section>
    <section class="card"><strong>Friend</strong><strong style="float:right" id="friendPct">0%</strong><div class="bar"><div class="fill" id="friendBar"></div></div><small class="muted" id="friendCount">0/0</small></section>
  </div>
  <section class="card">
    <h2>Today's routine</h2><p class="muted" style="margin-top:4px">Each task can apply to you, your friend, or both.</p>
    <div id="tasks"></div>
  </section>
  <section class="card"><strong>Current streak</strong><span style="float:right">🔥 <span id="streak">0</span> days</span><p class="muted" style="margin-top:6px">Version 1 foundation</p></section>
  <p id="status" class="muted" style="margin-top:14px" aria-live="polite"></p>
</main>
<div class="modal" id="modal">
  <form class="modalbox" id="form">
    <h2>Add task</h2>
    <label class="field">Task name<input id="name" maxlength="80" required placeholder="e.g. Read 20 minutes"></label>
    <label class="field">Type<select id="type"><option value="checkbox">Normal task</option><option value="water">Water portions</option></select></label>
    <label class="field">Applicable to<select id="whoSelect"><option value="both">Both</option><option value="me">You only</option><option value="friend">Friend only</option></select></label>
    <label class="field" id="portionField" style="display:none">Portion size<input id="portion" type="number" min="1" max="5000" value="250"> ml</label>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button class="primary">Add</button></div>
  </form>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY), $=id=>document.getElementById(id), today=new Date().toISOString().slice(0,10);
let session=null,profile=null,friendProfile=null,tasks=[],logs=new Map();
async function init(){const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session){$('who').textContent='Sign in to use shared tracking';const email=prompt('Enter your email. We\'ll send a magic sign-in link.');if(email){const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});$('status').textContent=error?error.message:'Check your email for the sign-in link.';}return;}await load();}
async function load(){const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();profile=p.data;$('who').textContent=profile?.display_name?`Hi ${profile.display_name}`:session.user.email;const m=await supabase.from('friendships').select('user_id,friend_id').or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`).eq('status','accepted');const row=m.data?.[0];const fid=row?(row.user_id===session.user.id?row.friend_id:row.user_id):null;if(fid){const f=await supabase.from('profiles').select('*').eq('id',fid).single();friendProfile=f.data;}const t=await supabase.from('tasks').select('*').order('created_at');tasks=t.data||[];const l=await supabase.from('daily_logs').select('*').eq('log_date',today);logs=new Map((l.data||[]).map(x=>[`${x.task_id}:${x.user_id}`,x]));render();}
function applicable(t,p){return t.applicable_to==='both'||t.applicable_to===p}
function render(){const list=$('tasks');list.innerHTML='';tasks.forEach(t=>{const row=document.createElement('div');row.className='task';const info=document.createElement('div');info.innerHTML=`<div class="taskname">${escapeHtml(t.name)}</div><div class="tag">${t.applicable_to==='both'?'Both':t.applicable_to==='me'?'You only':'Friend only'}${t.type==='water'?' · water portions':''}</div>`;row.append(info);[['me',session.user.id],['friend',friendProfile?.id]].forEach(([person,uid])=>{const can=!!uid&&applicable(t,person),log=uid?logs.get(`${t.id}:${uid}`):null,b=document.createElement('button');b.disabled=!can;if(t.type==='water'&&can){const ml=Number(log?.quantity||0),target=Number(t.target_quantity||3000);b.textContent=`${ml}/${target} ml`;b.addEventListener('click',()=>addWater(t,uid,log));}else{b.textContent=!can?'N/A':log?.completed?'✓ Done':'○ Pending';if(log?.completed)b.classList.add('done');if(can)b.addEventListener('click',()=>toggle(t,uid,log));}row.append(b)});list.append(row)});updateScores();}
async function toggle(t,uid,log){const completed=!(log?.completed),r=await supabase.from('daily_logs').upsert({task_id:t.id,user_id:uid,log_date:today,completed,quantity:completed?1:0},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){$('status').textContent=r.error.message;return}logs.set(`${t.id}:${uid}`,r.data);render();}
async function addWater(t,uid,log){const current=Number(log?.quantity||0),step=Number(t.portion_size||250),target=Number(t.target_quantity||3000),next=Math.min(target,current+step),r=await supabase.from('daily_logs').upsert({task_id:t.id,user_id:uid,log_date:today,completed:next>=target,quantity:next},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){$('status').textContent=r.error.message;return}logs.set(`${t.id}:${uid}`,r.data);render();}
function updateScores(){[['me',session.user.id,'my'],['friend',friendProfile?.id,'friend']].forEach(([p,uid,prefix])=>{const ats=tasks.filter(t=>uid&&applicable(t,p));let done=0,total=ats.length;ats.forEach(t=>{const l=logs.get(`${t.id}:${uid}`);if(t.type==='water'){done+=Math.min(Number(l?.quantity||0)/Number(t.target_quantity||3000),1)}else if(l?.completed)done+=1});const pct=total?Math.round(done/total*100):0;$(`${prefix}Pct`).textContent=pct+'%';$(`${prefix}Bar`).style.width=pct+'%';$(`${prefix}Count`).textContent=`${Math.round(done)}/${total} complete`;});}
$('addBtn').onclick=()=>{$('modal').classList.add('show');$('name').focus()};$('cancel').onclick=()=>{$('modal').classList.remove('show')};$('type').onchange=()=>{$('portionField').style.display=$('type').value==='water'?'grid':'none'};$('form').onsubmit=async e=>{e.preventDefault();const type=$('type').value,who=$('whoSelect').value,name=$('name').value.trim();if(!name)return;const payload={name,type,applicable_to:who,target_quantity:type==='water'?3000:null,portion_size:type==='water'?Math.max(1,Math.min(5000,Number($('portion').value)||250)):null,created_by:session.user.id};const r=await supabase.from('tasks').insert(payload);if(r.error){$('status').textContent=r.error.message;return}$('form').reset();$('modal').classList.remove('show');await load();};
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));} init();
</script>
</body>
</html>
