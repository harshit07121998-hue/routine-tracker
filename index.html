<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Routine Tracker</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17203a;background:#f7f9fc}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fc 0,#fff 70%);min-height:100vh}.app{max-width:760px;margin:auto;padding:24px 18px 42px}
    button,input,select{font:inherit}button{border:0;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:#1769ff;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:0 7px 18px rgba(23,105,255,.22)}h1,h2,p{margin:0}.brand h1{font-size:20px;letter-spacing:-.4px}.date{font-size:13px;color:#778198;margin-top:3px}.logout{padding:10px 14px;border:1px solid #e1e6ef;border-radius:11px;background:#fff;color:#34405a;font-weight:600}
    .hero{margin-bottom:20px}.hero h2{font-size:29px;letter-spacing:-1px}.hero p{color:#6b768c;margin-top:6px;font-size:15px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:rgba(255,255,255,.92);border:1px solid #e5eaf2;border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(31,49,79,.055)}.label{color:#657089;font-size:13px;font-weight:600}.big{font-size:32px;font-weight:750;letter-spacing:-1px;margin-top:8px}.sub{color:#7a8497;font-size:13px;margin-top:5px}.accent{color:#1769ff}.green{color:#0b9b67}.purple{color:#7542ee}.orange{color:#ef7d22}
    .person{position:relative;overflow:hidden;min-height:166px}.person-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.person-name{font-size:19px;font-weight:750}.you-badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef5ff;color:#1769ff;font-weight:700}.sticker{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:47px;margin-top:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}.boy{background:linear-gradient(145deg,#eaf3ff,#dceaff)}.girl{background:linear-gradient(145deg,#fff0fa,#f5ddff)}.score-row{display:flex;align-items:end;justify-content:space-between;margin-top:-3px}.score{font-size:29px;font-weight:800;letter-spacing:-1px}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;border-radius:99px;background:#1769ff;transition:width .35s}.person .fill.friend{background:#8a4cf4}.person-note{font-size:12px;color:#7a8497;margin-top:7px}
    .average{grid-column:1/-1}.average-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.average-value{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin-top:8px}.range{color:#7a8497;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.mini{padding:12px 13px;border-radius:14px;background:#f7f9fc;border:1px solid #edf0f5}.mini strong{font-size:15px}.mini span{display:block;font-size:22px;font-weight:800;margin-top:3px}.quote{margin-top:14px;padding:22px 20px;background:linear-gradient(135deg,#edf5ff,#fff);border:1px solid #dce8fa;border-radius:20px;position:relative;overflow:hidden}.quote:after{content:'“';position:absolute;right:18px;bottom:-25px;font-size:120px;line-height:1;color:#dbe9ff;font-weight:800}.quote p{position:relative;z-index:1;font-size:17px;line-height:1.55;font-weight:650;max-width:600px}.quote small{display:block;position:relative;z-index:1;color:#6c7890;margin-top:8px}.status{min-height:20px;text-align:center;color:#b42318;font-size:13px;margin-top:12px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:100%;max-width:390px}.login-card{margin-top:20px}.field{display:grid;gap:7px;margin:13px 0}.field span{font-size:13px;font-weight:650;color:#526078}.field input{height:48px;border:1px solid #dce2eb;border-radius:12px;padding:0 13px;outline:none;background:#fff}.field input:focus{border-color:#1769ff;box-shadow:0 0 0 3px rgba(23,105,255,.1)}.login-btn{width:100%;height:48px;border-radius:12px;background:#1769ff;color:#fff;font-weight:700;margin-top:8px}.login-btn:disabled{opacity:.65;cursor:wait}.login-error{color:#b42318;font-size:13px;margin-top:10px;min-height:18px}.login-help{color:#7a8497;font-size:12px;text-align:center;margin-top:14px}
    @media(max-width:520px){.app{padding:18px 14px 34px}.top{margin-bottom:22px}.hero h2{font-size:25px}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px;border-radius:17px}.big{font-size:27px}.person{min-height:155px}.sticker{width:62px;height:62px;font-size:40px;border-radius:20px}.person-name{font-size:17px}.average{grid-column:1/-1}.quote p{font-size:16px}}
    @media(max-width:360px){.cards{grid-template-columns:1fr}.average{grid-column:auto}.top{align-items:flex-start}.logout{padding:9px 11px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const root=document.getElementById('root');
const USERS={Harshit:{email:'harshit@routine.app'},Sapana:{email:'sapana@routine.app'}};
let session=null,profile=null,friendProfile=null,tasks=[];
const todayDate=new Date();
const today=todayDate.toISOString().slice(0,10);
const tenDaysAgoDate=new Date(todayDate);tenDaysAgoDate.setDate(tenDaysAgoDate.getDate()-9);
const tenDaysAgo=tenDaysAgoDate.toISOString().slice(0,10);
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatDate(d){return new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function loginScreen(message=''){
  root.innerHTML=`<main class="login-wrap"><section class="login"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">Private shared dashboard</p></div></div><div class="card login-card"><label class="field"><span>User ID</span><input id="loginId" autocomplete="username" placeholder="Enter your ID"></label><label class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password"></label><button class="login-btn" id="loginBtn">Log in</button><p id="loginError" class="login-error">${escapeHtml(message)}</p><p class="login-help">Two-user private access</p></div></section></main>`;
  document.getElementById('loginBtn').onclick=login;
  document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
}
async function login(){
  const id=document.getElementById('loginId').value.trim(),password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');
  if(!USERS[id]){document.getElementById('loginError').textContent='Use Harshit or Sapana as the User ID.';return}
  if(!password){document.getElementById('loginError').textContent='Enter your password.';return}
  btn.disabled=true;btn.textContent='Logging in…';
  const {error}=await supabase.auth.signInWithPassword({email:USERS[id].email,password});
  if(error){document.getElementById('loginError').textContent='Incorrect User ID or password.';btn.disabled=false;btn.textContent='Log in';return}
  await init();
}
async function init(){
  const {data:{session:s}}=await supabase.auth.getSession();session=s;
  if(!session){loginScreen();return}
  renderShell();
  await loadDashboard();
}
function renderShell(){
  root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date" id="todayDate">${formatDate(todayDate)}</p></div></div><button class="logout" id="logoutBtn">Log out</button></header><section class="hero"><h2 id="greeting">Good morning! 👋</h2><p>Your shared progress, at a glance.</p></section><section class="cards"><article class="card"><div class="label">Today</div><div class="big" id="todayText">${formatDate(todayDate).split(',').slice(1).join(',').trim()}</div><div class="sub">Daily score snapshot</div></article><article class="card"><div class="label">10-Day Average</div><div class="average-value purple" id="combinedAvg">0%</div><div class="sub">Combined average score</div></article><article class="card person"><div class="person-top"><div class="person-name">Harshit</div><span class="you-badge" id="harshitBadge" style="display:none">You</span></div><div class="score-row"><div><div class="score accent" id="harshitScore">0%</div><div class="person-note">Today's score</div></div><div class="sticker boy" aria-label="Boy sticker">👦🏻</div></div><div class="progress"><div class="fill" id="harshitBar"></div></div></article><article class="card person"><div class="person-top"><div class="person-name">Sapana</div><span class="you-badge" id="sapanaBadge" style="display:none">You</span></div><div class="score-row"><div><div class="score purple" id="sapanaScore">0%</div><div class="person-note">Today's score</div></div><div class="sticker girl" aria-label="Girl sticker">👧🏻</div></div><div class="progress"><div class="fill friend" id="sapanaBar"></div></div></article><article class="card average"><div class="average-head"><div><div class="label">Last 10 Days Average Score</div><div class="range">${formatDate(tenDaysAgoDate)} – ${formatDate(todayDate)}</div></div><div style="font-size:28px">📈</div></div><div class="split"><div class="mini"><strong>Harshit</strong><span class="accent" id="harshitAvg">0%</span></div><div class="mini"><strong>Sapana</strong><span class="purple" id="sapanaAvg">0%</span></div></div></article></section><section class="quote"><p>Small steps every day create remarkable results.</p><small>— Keep going. Consistency wins.</small></section><p class="status" id="status" aria-live="polite"></p></main>`;
  document.getElementById('logoutBtn').onclick=logout;
}
async function logout(){await supabase.auth.signOut();session=null;profile=null;friendProfile=null;loginScreen();}
async function loadDashboard(){
  try{
    const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();
    profile=p.data;
    const myName=profile?.display_name || (session.user.email||'').split('@')[0];
    document.getElementById('greeting').textContent=`Good morning, ${myName}! 👋`;
    const m=await supabase.from('friendships').select('user_id,friend_id').or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`).eq('status','accepted');
    const row=m.data?.[0];
    const fid=row?(row.user_id===session.user.id?row.friend_id:row.user_id):null;
    if(fid){const f=await supabase.from('profiles').select('*').eq('id',fid).single();friendProfile=f.data;}
    const t=await supabase.from('tasks').select('*').order('created_at');
    tasks=t.data||[];
    const l=await supabase.from('daily_logs').select('*').gte('log_date',tenDaysAgo).lte('log_date',today);
    const logs=l.data||[];
    const harshitId=getPersonId('Harshit'),sapanaId=getPersonId('Sapana');
    const hToday=scoreForDay(harshitId,tasks,logs,today,'Harshit');
    const sToday=scoreForDay(sapanaId,tasks,logs,today,'Sapana');
    const hAvg=averageScore(harshitId,tasks,logs,'Harshit');
    const sAvg=averageScore(sapanaId,tasks,logs,'Sapana');
    setScore('harshit',hToday);setScore('sapana',sToday);
    document.getElementById('harshitAvg').textContent=hAvg+'%';document.getElementById('sapanaAvg').textContent=sAvg+'%';document.getElementById('combinedAvg').textContent=Math.round((hAvg+sAvg)/2)+'%';
    const currentEmail=(session.user.email||'').toLowerCase();
    if(currentEmail==='harshit@routine.app')document.getElementById('harshitBadge').style.display='inline-block';
    if(currentEmail==='sapana@routine.app')document.getElementById('sapanaBadge').style.display='inline-block';
  }catch(e){document.getElementById('status').textContent='Unable to load dashboard data.';}
}
function getPersonId(name){
  const current=(session.user.email||'').toLowerCase();
  if(name==='Harshit'&&current==='harshit@routine.app')return session.user.id;
  if(name==='Sapana'&&current==='sapana@routine.app')return session.user.id;
  if(friendProfile?.display_name?.toLowerCase()===name.toLowerCase())return friendProfile.id;
  return null;
}
function applicable(t,name){return t.applicable_to==='both'||(name==='Harshit'&&t.applicable_to==='me')||(name==='Sapana'&&t.applicable_to==='friend')}
function scoreForDay(uid,taskList,logs,date,name){
  if(!uid)return 0;
  const applicableTasks=taskList.filter(t=>applicable(t,name));if(!applicableTasks.length)return 0;
  let points=0;
  for(const t of applicableTasks){const l=logs.find(x=>x.task_id===t.id&&x.user_id===uid&&x.log_date===date);if(t.type==='water')points+=Math.min(Number(l?.quantity||0)/Number(t.target_quantity||3000),1);else if(l?.completed)points+=1;}
  return Math.round(points/applicableTasks.length*100);
}
function averageScore(uid,taskList,logs,name){
  if(!uid)return 0;
  let total=0,count=0;for(let i=0;i<10;i++){const d=new Date(tenDaysAgoDate);d.setDate(d.getDate()+i);const date=d.toISOString().slice(0,10);total+=scoreForDay(uid,taskList,logs,date,name);count++;}
  return count?Math.round(total/count):0;
}
function setScore(person,value){document.getElementById(person+'Score').textContent=value+'%';document.getElementById(person+'Bar').style.width=value+'%';}
init();
</script>
</body>
</html>
