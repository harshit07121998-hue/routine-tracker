<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Routine Tracker</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#fff}
    *{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:24px 16px 48px}
    h1,h2,p{margin:0}.muted{color:#667085}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button,input,select{font:inherit}button{min-height:44px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:0 14px;cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.65}.primary{background:#17202a;color:#fff;border-color:#17202a}.card{border:1px solid #e4e7ec;border-radius:18px;padding:16px;margin-top:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:12px 0 7px}.fill{height:100%;background:#17202a;width:0}
    .task{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid #eef0f3}
    .task:last-child{border-bottom:0}.taskname{font-weight:600}.tag{font-size:12px;color:#667085;margin-top:3px}
    .done{background:#eef6ee;border-color:#b7d5b8}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);padding:24px;align-items:center;justify-content:center}.modal.show{display:flex}
    .modalbox{background:#fff;border-radius:18px;padding:18px;max-width:420px;width:100%}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 10px}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login{width:100%;max-width:390px}.login h1{margin-bottom:8px}.login .card{margin-top:20px}.login button{width:100%;margin-top:8px}.error{color:#b42318;margin-top:10px;font-size:14px}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.task{grid-template-columns:minmax(0,1fr) auto}.task button:last-child{grid-column:2}.top{align-items:center}.actions{width:100%}.actions button{flex:1}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY), today=new Date().toISOString().slice(0,10);
const USERS={Harshit:{email:'harshit@routine.app'},Sapana:{email:'sapana@routine.app'}};
let session=null,profile=null,friendProfile=null,tasks=[],logs=new Map();
function loginScreen(message=''){root.innerHTML=`<main class="login-wrap"><section class="login"><p class="muted">Shared routine tracker</p><h1>Routine Tracker</h1><div class="card"><label class="field">User ID<select id="loginId"><option>Harshit</option><option>Sapana</option></select></label><label class="field">Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password"></label><button class="primary" id="loginBtn">Log in</button><p id="loginError" class="error">${message}</p></div></section></main>`;document.getElementById('loginBtn').onclick=login;document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});}
async function login(){const id=document.getElementById('loginId').value,password=document.getElementById('loginPassword').value;const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Logging in…';const {error}=await supabase.auth.signInWithPassword({email:USERS[id].email,password});if(error){document.getElementById('loginError').textContent='Incorrect User ID or password.';btn.disabled=false;btn.textContent='Log in';return}await init();}
async function init(){const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session){loginScreen();return}renderApp();await load();}
function renderApp(){root.innerHTML=`<main class="app"><div class="top"><div><p class="muted">Today</p><h1>Routine Tracker</h1><p class="muted" id="who">Loading…</p></div><div class="actions"><button id="logoutBtn">Log out</button><button id="addBtn">+ Add task</button></div></div><div class="grid"><section class="card"><strong>You</strong><strong style="float:right" id="myPct">0%</strong><div class="bar"><div class="fill" id="myBar"></div></div><small class="muted" id="myCount">0/0</small></section><section class="card"><strong>Friend</strong><strong style="float:right" id="friendPct">0%</strong><div class="bar"><div class="fill" id="friendBar"></div></div><small class="muted" id="friendCount">0/0</small></section></div><section class="card"><h2>Today's routine</h2><p class="muted" style="margin-top:4px">Each task can apply to you, your friend, or both.</p><div id="tasks"></div></section><section class="card"><strong>Current streak</strong><span style="float:right">🔥 <span id="streak">0</span> days</span><p class="muted" style="margin-top:6px">Version 1 foundation</p></section><p id="status" class="muted" style="margin-top:14px" aria-live="polite"></p></main><div class="modal" id="modal"><form class="modalbox" id="form"><h2>Add task</h2><label class="field">Task name<input id="name" maxlength="80" required placeholder="e.g. Read 20 minutes"></label><label class="field">Type<select id="type"><option value="checkbox">Normal task</option><option value="water">Water portions</option></select></label><label class="field">Applicable to<select id="whoSelect"><option value="both">Both</option><option value="me">You only</option><option value="friend">Friend only</option></select></label><label class="field" id="portionField" style="display:none">Portion size<input id="portion" type="number" min="1" max="5000" value="250"> ml</label><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button class="primary">Add</button></div></form></div>`;document.getElementById('logoutBtn').onclick=logout;document.getElementById('addBtn').onclick=()=>{document.getElementById('modal').classList.add('show');document.getElementById('name').focus()};document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('type').onchange=()=>document.getElementById('portionField').style.display=document.getElementById('type').value==='water'?'grid':'none';document.getElementById('form').onsubmit=addTask;}
async function logout(){await supabase.auth.signOut();session=null;loginScreen();}
async function load(){const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();profile=p.data;document.getElementById('who').textContent=profile?.display_name||session.user.email;const m=await supabase.from('friendships').select('user_id,friend_id').or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`).eq('status','accepted');const row=m.data?.[0];const fid=row?(row.user_id===session.user.id?row.friend_id:row.user_id):null;if(fid){const f=await supabase.from('profiles').select('*').eq('id',fid).single();friendProfile=f.data;}const t=await supabase.from('tasks').select('*').order('created_at');tasks=t.data||[];const l=await supabase.from('daily_logs').select('*').eq('log_date',today);logs=new Map((l.data||[]).map(x=>[`${x.task_id}:${x.user_id}`,x]));render();}
function applicable(t,p){return t.applicable_to==='both'||t.applicable_to===p}
function render(){const list=document.getElementById('tasks');list.innerHTML='';tasks.forEach(t=>{const row=document.createElement('div');row.className='task';const info=document.createElement('div');info.innerHTML=`<div class="taskname">${escapeHtml(t.name)}</div><div class="tag">${t.applicable_to==='both'?'Both':t.applicable_to==='me'?'You only':'Friend only'}${t.type==='water'?' · water portions':''}</div>`;row.append(info);[['me',session.user.id],['friend',friendProfile?.id]].forEach(([person,uid])=>{const can=!!uid&&applicable(t,person),log=uid?logs.get(`${t.id}:${uid}`):null,b=document.createElement('button');b.disabled=!can;if(t.type==='water'&&can){const ml=Number(log?.quantity||0),target=Number(t.target_quantity||3000);b.textContent=`${ml}/${target} ml`;b.addEventListener('click',()=>addWater(t,uid,log));}else{b.textContent=!can?'N/A':log?.completed?'✓ Done':'○ Pending';if(log?.completed)b.classList.add('done');if(can)b.addEventListener('click',()=>toggle(t,uid,log));}row.append(b)});list.append(row)});updateScores();}
async function toggle(t,uid,log){const completed=!(log?.completed),r=await supabase.from('daily_logs').upsert({task_id:t.id,user_id:uid,log_date:today,completed,quantity:completed?1:0},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){document.getElementById('status').textContent=r.error.message;return}logs.set(`${t.id}:${uid}`,r.data);render();}
async function addWater(t,uid,log){const current=Number(log?.quantity||0),step=Number(t.portion_size||250),target=Number(t.target_quantity||3000),next=Math.min(target,current+step),r=await supabase.from('daily_logs').upsert({task_id:t.id,user_id:uid,log_date:today,completed:next>=target,quantity:next},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){document.getElementById('status').textContent=r.error.message;return}logs.set(`${t.id}:${uid}`,r.data);render();}
function updateScores(){[['me',session.user.id,'my'],['friend',friendProfile?.id,'friend']].forEach(([p,uid,prefix])=>{const ats=tasks.filter(t=>uid&&applicable(t,p));let done=0,total=ats.length;ats.forEach(t=>{const l=logs.get(`${t.id}:${uid}`);if(t.type==='water')done+=Math.min(Number(l?.quantity||0)/Number(t.target_quantity||3000),1);else if(l?.completed)done+=1});const pct=total?Math.round(done/total*100):0;document.getElementById(`${prefix}Pct`).textContent=pct+'%';document.getElementById(`${prefix}Bar`).style.width=pct+'%';document.getElementById(`${prefix}Count`).textContent=`${Math.round(done)}/${total} complete`;});}
async function addTask(e){e.preventDefault();const type=document.getElementById('type').value,who=document.getElementById('whoSelect').value,name=document.getElementById('name').value.trim();if(!name)return;const payload={name,type,applicable_to:who,target_quantity:type==='water'?3000:null,portion_size:type==='water'?Math.max(1,Math.min(5000,Number(document.getElementById('portion').value)||250)):null,created_by:session.user.id};const r=await supabase.from('tasks').insert(payload);if(r.error){document.getElementById('status').textContent=r.error.message;return}document.getElementById('form').reset();document.getElementById('modal').classList.remove('show');await load();}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
init();
</script>
</body>
</html>
