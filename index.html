<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f7f9fc"><title>Routine Tracker</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17203a;background:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7f9fc,#fff);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:20px 14px 40px}.top,.brand,.person-top,.score-row,.avg-head{display:flex;align-items:center}.top{justify-content:space-between;gap:12px}.brand{gap:10px}.logo{width:43px;height:43px;border-radius:13px;background:#1769ff;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}.brand h1{margin:0;font-size:20px}.date,.sub,.note{color:#778198;font-size:13px;margin:4px 0 0}.logout,.backdash{border:1px solid #dfe5ee;border-radius:12px;background:#fff;color:#34405a;font-weight:700;padding:10px 14px}.hero{margin:25px 0 18px}.hero h2{margin:0;font-size:27px}.hero p{color:#6b768c;margin:7px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:19px;padding:16px;box-shadow:0 7px 25px #1f314f0d}.label{font-size:13px;color:#657089;font-weight:650}.big{font-size:27px;font-weight:850;margin-top:8px}.person{width:100%;text-align:left;min-height:165px}.person-top,.score-row,.avg-head{justify-content:space-between;gap:8px}.person-name{font-size:19px;font-weight:800}.you{font-size:10px;padding:5px 8px;border-radius:99px;background:#eef5ff;color:#1769ff;font-weight:750}.score{font-size:30px;font-weight:900;margin-top:9px}.sticker{width:64px;height:64px;border-radius:21px;display:grid;place-items:center;font-size:42px}.boy{background:#e7f1ff}.girl{background:#fae7f7}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:13px}.fill{height:100%;width:0;background:#1769ff;border-radius:99px}.friendfill{background:#8a4cf4}.average{grid-column:1/-1}.avg{font-size:33px;font-weight:900;margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.mini{background:#f7f9fc;border:1px solid #edf0f5;border-radius:14px;padding:12px}.mini span{display:block;font-size:21px;font-weight:850;margin-top:3px}.addbar{margin-top:15px}.addmain{width:100%;height:48px;border:0;border-radius:13px;background:#1769ff;color:#fff;font-weight:800}.quote{margin-top:14px;padding:21px 18px;background:#edf5ff;border:1px solid #dce8fa;border-radius:19px}.quote p{margin:0;font-size:16px;line-height:1.55;font-weight:680}.quote small{display:block;color:#6c7890;margin-top:8px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:100%;max-width:390px}.field{display:grid;gap:8px;margin:14px 0}.field span{font-size:14px;font-weight:700;color:#526078}.field input,.field select{height:48px;border:1px solid #dce2eb;border-radius:12px;padding:0 13px;background:#fff}.login-btn{width:100%;height:48px;border:0;border-radius:12px;background:#1769ff;color:#fff;font-weight:750}.error{color:#b42318;font-size:13px;margin-top:10px;min-height:18px}.modal{display:none;position:fixed;inset:0;background:#111b3066;padding:15px;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:620px;background:#fff;border-radius:24px 24px 16px 16px;padding:20px 17px 24px;max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheettitle{font-size:22px;font-weight:850}.hint{font-size:13px;color:#7a8497;margin-top:5px}.close{width:40px;height:40px;border:0;border-radius:50%;background:#f2f4f7;font-size:21px}.formgrid{display:grid;gap:13px;margin-top:13px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.page{min-height:100vh;padding:15px;background:linear-gradient(#f7f9fc,#fff)}.inner{max-width:760px;margin:auto}.nav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:12px}.nav button{width:46px;height:46px;border-radius:13px;border:1px solid #e1e6ef;background:#fff;font-size:26px;color:#34405a}.nav button:disabled{opacity:.3}.heading{text-align:center}.heading small{font-size:14px;color:#6b768c;font-weight:700}.heading strong{display:block;font-size:21px;margin-top:4px}.today{font-size:11px;color:#1769ff;font-weight:800;margin-top:4px}.scorebox{margin:20px 0 15px;padding:19px;background:#fff;border:1px solid #e5eaf2;border-radius:21px;display:flex;justify-content:space-between;align-items:center}.scorebox .n{font-size:36px;font-weight:900;margin-top:4px}.tasks{display:grid;gap:11px}.task{background:#fff;border:1px solid #e5eaf2;border-radius:17px;padding:16px;display:flex;align-items:center;gap:12px}.taskinfo{flex:1;min-width:0}.taskinfo b{font-size:16px;line-height:1.45}.taskinfo small{display:block;color:#7a8497;font-size:12px;line-height:1.5;margin-top:5px}.count{font-size:13px;font-weight:800;color:#657089}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900}.pending{background:#fff1b8;color:#b77900}.complete{background:#dff7eb;color:#07945f}.missed{background:#ffe1e1;color:#d92d20}.act{width:35px;height:35px;border:0;border-radius:10px;background:#f3f5f8;color:#536078;font-size:19px}.legend{margin-top:13px;font-size:12px;color:#6d7890;display:flex;gap:14px}.backdash{display:block;margin:22px auto 0;height:46px}@media(max-width:520px){.app{padding:18px 13px 32px}.cards{gap:10px}.card{padding:14px}.person-name{font-size:17px}.score{font-size:27px}.sticker{width:60px;height:60px;font-size:39px}.formrow{grid-template-columns:1fr}.nav{grid-template-columns:43px 1fr 43px}.nav button{width:43px;height:43px}.heading strong{font-size:19px}.taskinfo b{font-size:15px}.task{padding:15px}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><section class="sheet"><div class="sheethead"><div><div class="sheettitle">Add Routine</div><div class="hint">Create a daily task and choose who it applies to.</div></div><button class="close" id="close">×</button></div><form id="form" class="formgrid"><label class="field"><span>Task</span><input id="taskName" maxlength="80" required placeholder="e.g. Workout"></label><div class="formrow"><label class="field"><span>Frequency</span><select id="frequency"><option value="daily">Daily</option></select></label><label class="field"><span># of times / day</span><input id="times" type="number" min="1" max="20" value="1" required></label></div><label class="field"><span>Applicable on</span><select id="applicable"><option value="h">Harshit only</option><option value="s">Sapana only</option><option value="both">Both</option></select></label><button class="addmain">Add Routine</button><p class="error" id="addError"></p></form></section></div><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from"./config.js";const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),root=document.getElementById('root'),AUTH={Harshit:'harshit@routine.app',Sapana:'sapana@routine.app'};let session=null,profile=null,friendId=null,tasks=[],logs=[],person='',pageDate='';const localISO=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},today=localISO(),D=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)},add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},fmt=s=>new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(D(s)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loginScreen(msg=''){root.innerHTML=`<main class="login-wrap"><section class="login"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">Private shared dashboard</p></div></div><div class="card" style="margin-top:20px"><label class="field"><span>User ID</span><input id="loginId"></label><label class="field"><span>Password</span><input id="loginPassword" type="password"></label><button class="login-btn" id="loginBtn">Log in</button><p class="error" id="loginError">${esc(msg)}</p></div></section></main>`;loginBtn.onclick=login;loginPassword.onkeydown=e=>e.key==='Enter'&&login()}
async function login(){const id=loginId.value.trim(),p=loginPassword.value;if(!AUTH[id]){loginError.textContent='Use Harshit or Sapana.';return}loginBtn.disabled=true;const r=await db.auth.signInWithPassword({email:AUTH[id],password:p});if(r.error){loginError.textContent='Incorrect User ID or password.';loginBtn.disabled=false;return}await init()}
async function init(){const r=await db.auth.getSession();session=r.data.session;if(!session)return loginScreen();await load();dashboard()}
async function load(){const p=await db.from('profiles').select('*').eq('id',session.user.id).single();profile=p.data;const f=await db.from('friendships').select('user_id,friend_id').or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`).eq('status','accepted').maybeSingle();friendId=f.data?(f.data.user_id===session.user.id?f.data.friend_id:f.data.user_id):null;const t=await db.from('tasks').select('*').order('created_at');tasks=t.data||[];const l=await db.from('daily_logs').select('*').lte('log_date',today);logs=l.data||[]}
function uidFor(n){return(n==='Harshit'&&session.user.email===AUTH.Harshit)||(n==='Sapana'&&session.user.email===AUTH.Sapana)?session.user.id:friendId}function applies(t,n){const a=String(t.applicable_to||'').toLowerCase();return a==='both'||a===(n==='Harshit'?'h':'s')||a===n.toLowerCase()}function target(t){return Math.max(1,Number(t.target_quantity||1))}function qty(t,u,d){const l=logs.find(x=>x.task_id===t.id&&x.user_id===u&&x.log_date===d);return Number(l?.quantity||0)}function score(n,d){const u=uidFor(n),ts=tasks.filter(t=>u&&applies(t,n));if(!ts.length)return 0;return Math.round(ts.reduce((z,t)=>z+Math.min(qty(t,u,d)/target(t),1),0)/ts.length*100)}function avg(n){let z=0;for(let i=0;i<10;i++)z+=score(n,add(today,-i));return Math.round(z/10)}
function dashboard(){root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">${fmt(today)}</p></div></div><button class="logout" id="out">Log out</button></header><section class="hero"><h2>Good morning, ${esc(profile?.display_name||'')}! 👋</h2><p>Your shared progress, at a glance.</p></section><section class="cards"><article class="card"><div class="label">Today</div><div class="big">${fmt(today)}</div><div class="sub">Daily score snapshot</div></article><article class="card"><div class="label">10-Day Average</div><div class="avg purple" id="combined">0%</div><div class="sub">Combined average score</div></article><button class="card person" id="hc"><div class="person-top"><span class="person-name">Harshit</span><span class="you" id="hy" style="display:none">You</span></div><div class="score-row"><div><div class="score" id="hscore">0%</div><div class="note">Today's score · Tap for tasks</div></div><div class="sticker boy">👦🏻</div></div><div class="progress"><div class="fill" id="hbar"></div></div></button><button class="card person" id="sc"><div class="person-top"><span class="person-name">Sapana</span><span class="you" id="sy" style="display:none">You</span></div><div class="score-row"><div><div class="score purple" id="sscore">0%</div><div class="note">Today's score · Tap for tasks</div></div><div class="sticker girl">👧🏻</div></div><div class="progress"><div class="fill friendfill" id="sbar"></div></div></button><article class="card average"><div class="avg-head"><div><div class="label">Last 10 Days Average Score</div><div class="date">${fmt(add(today,-9))} – ${fmt(today)}</div></div><span style="font-size:27px">📈</span></div><div class="split"><div class="mini"><strong>Harshit</strong><span class="purple" id="havg">0%</span></div><div class="mini"><strong>Sapana</strong><span class="purple" id="savg">0%</span></div></div></article></section><div class="addbar"><button class="addmain" id="addRoutine">＋ Add Routine</button></div><section class="quote"><p>Small steps every day create remarkable results.</p><small>— Keep going. Consistency wins.</small></section></main>`;out.onclick=logout;hc.onclick=()=>openPerson('Harshit',today);sc.onclick=()=>openPerson('Sapana',today);addRoutine.onclick=()=>modal.classList.add('show');close.onclick=()=>modal.classList.remove('show');const h=score('Harshit',today),s=score('Sapana',today),ha=avg('Harshit'),sa=avg('Sapana');hscore.textContent=h+'%';sscore.textContent=s+'%';hbar.style.width=h+'%';sbar.style.width=s+'%';havg.textContent=ha+'%';savg.textContent=sa+'%';combined.textContent=Math.round((ha+sa)/2)+'%';if(session.user.email===AUTH.Harshit)hy.style.display='inline-block';if(session.user.email===AUTH.Sapana)sy.style.display='inline-block'}
async function logout(){await db.auth.signOut();session=null;loginScreen()}function openPerson(n,d){person=n;pageDate=d;renderPage()}function renderPage(){const u=uidFor(person),list=tasks.filter(t=>u&&applies(t,person)),next=add(pageDate,1);root.innerHTML=`<main class="page"><div class="inner"><div class="nav"><button id="prev" title="Yesterday">‹</button><div class="heading"><small>${esc(person)}'s Tasks</small><strong>${fmt(pageDate)}</strong>${pageDate===today?'<div class="today">TODAY</div>':''}</div><button id="next" title="Tomorrow">›</button></div><section class="scorebox"><div><div class="label">Daily Score</div><div class="n">${score(person,pageDate)}%</div><div class="sub">Completed task targets for this date</div></div><div class="sticker ${person==='Harshit'?'boy':'girl'}">${person==='Harshit'?'👦🏻':'👧🏻'}</div></section><section class="tasks">${list.length?list.map(t=>{const q=qty(t,u,pageDate),n=target(t),done=q>=n,miss=pageDate<today&&!done;return`<div class="task"><div class="taskinfo"><b>${esc(t.name)}</b><small>Daily · ${n} ${n===1?'time':'times'} / day</small></div><span class="count">${q}/${n}</span><span class="dot ${done?'complete':miss?'missed':'pending'}">${done?'✓':miss?'×':'•'}</span><button class="act" data-id="${t.id}">${done?'↶':'+'}</button></div>`}).join(''):'<div class="empty">No routines are assigned to this person.</div>'}</section><div class="legend"><b>🟡 Pending</b><b>🟢 Completed</b><b>🔴 Missed</b></div><button class="backdash" id="bd">← Back to Dashboard</button></div></main>`;prev.onclick=()=>{pageDate=add(pageDate,-1);renderPage()};next.onclick=()=>{pageDate=next;renderPage()};bd.onclick=()=>{dashboard()};document.querySelectorAll('.act').forEach(b=>b.onclick=()=>change(b.dataset.id,u))}
async function change(id,u){const t=tasks.find(x=>x.id===id),n=target(t),q=qty(t,u,pageDate),v=q>=n?q-1:q+1,r=await db.from('daily_logs').upsert({task_id:id,user_id:u,log_date:pageDate,completed:v>=n,quantity:v},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){alert(r.error.message);return}const i=logs.findIndex(x=>x.task_id===id&&x.user_id===u&&x.log_date===pageDate);if(i>=0)logs[i]=r.data;else logs.push(r.data);renderPage()}
form.onsubmit=async e=>{e.preventDefault();const task=taskName.value.trim(),n=Math.max(1,Math.min(20,Number(times.value)||1)),a=applicable.value;if(!task)return;const creator=profile?.id||session.user.id,r=await db.from('tasks').insert({name:task,type:'checkbox',applicable_to:a,target_quantity:n,portion_size:null,created_by:creator});if(r.error){addError.textContent=r.error.message;return}modal.classList.remove('show');form.reset();times.value=1;await load();dashboard()};init();
</script></body></html>
