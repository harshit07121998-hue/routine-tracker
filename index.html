<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<link rel="manifest" href="manifest.webmanifest">
<title>Routine Tracker</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17203a;background:#f7f9fc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fc 0,#fff 72%);min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:20px 16px 38px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#1769ff;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 7px 18px rgba(23,105,255,.2)}h1,h2,p{margin:0}.brand h1{font-size:20px;letter-spacing:-.4px}.date{font-size:13px;color:#778198;margin-top:3px}.logout{padding:10px 13px;border:1px solid #e1e6ef;border-radius:11px;background:#fff;color:#34405a;font-weight:650}
.hero{margin-bottom:18px}.hero h2{font-size:28px;letter-spacing:-1px}.hero p{color:#6b768c;margin-top:5px;font-size:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:rgba(255,255,255,.94);border:1px solid #e5eaf2;border-radius:19px;padding:16px;box-shadow:0 8px 28px rgba(31,49,79,.055)}.label{color:#657089;font-size:13px;font-weight:650}.big{font-size:29px;font-weight:800;letter-spacing:-1px;margin-top:7px}.sub{color:#7a8497;font-size:12px;margin-top:4px}.accent{color:#1769ff}.purple{color:#7542ee}
.person{min-height:168px;text-align:left;transition:.18s transform,.18s box-shadow}.person:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(31,49,79,.11)}.person:active{transform:scale(.985)}.person-top{display:flex;align-items:center;justify-content:space-between;gap:7px}.person-name{font-size:19px;font-weight:780}.you-badge{font-size:10px;padding:5px 8px;border-radius:99px;background:#eef5ff;color:#1769ff;font-weight:750}.score-row{display:flex;align-items:end;justify-content:space-between;margin-top:10px}.score{font-size:30px;font-weight:850;letter-spacing:-1px}.sticker{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:44px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}.boy{background:linear-gradient(145deg,#eaf3ff,#dceaff)}.girl{background:linear-gradient(145deg,#fff0fa,#f5ddff)}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;border-radius:99px;background:#1769ff;transition:width .3s}.fill.friend{background:#8a4cf4}.person-note{font-size:12px;color:#7a8497;margin-top:4px}.average{grid-column:1/-1}.average-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.average-value{font-size:34px;font-weight:850;letter-spacing:-1.2px;margin-top:7px}.range{color:#7a8497;font-size:11px;margin-top:2px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.mini{padding:11px 12px;border-radius:14px;background:#f7f9fc;border:1px solid #edf0f5}.mini strong{font-size:14px}.mini span{display:block;font-size:21px;font-weight:850;margin-top:2px}.quote{margin-top:13px;padding:21px 18px;background:linear-gradient(135deg,#edf5ff,#fff);border:1px solid #dce8fa;border-radius:19px;position:relative;overflow:hidden}.quote:after{content:'“';position:absolute;right:17px;bottom:-26px;font-size:120px;line-height:1;color:#dbe9ff;font-weight:800}.quote p{position:relative;z-index:1;font-size:16px;line-height:1.5;font-weight:680;max-width:600px}.quote small{display:block;position:relative;z-index:1;color:#6c7890;margin-top:7px}
.status{min-height:20px;text-align:center;color:#b42318;font-size:13px;margin-top:10px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:100%;max-width:390px}.login-card{margin-top:20px}.field{display:grid;gap:7px;margin:13px 0}.field span{font-size:13px;font-weight:650;color:#526078}.field input,.field select{height:48px;border:1px solid #dce2eb;border-radius:12px;padding:0 13px;outline:none;background:#fff}.login-btn{width:100%;height:48px;border-radius:12px;background:#1769ff;color:#fff;font-weight:700;margin-top:8px}.login-error{color:#b42318;font-size:13px;margin-top:10px;min-height:18px}.login-help{color:#7a8497;font-size:12px;text-align:center;margin-top:13px}
.modal{display:none;position:fixed;inset:0;background:rgba(17,27,48,.38);padding:16px;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:600px;background:#fff;border-radius:24px 24px 16px 16px;padding:18px 16px 20px;max-height:88vh;overflow:auto;box-shadow:0 -12px 40px rgba(17,27,48,.16)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.sheet-title{font-size:21px;font-weight:800}.close{width:38px;height:38px;border-radius:50%;background:#f3f5f8;color:#47536a;font-size:20px}.sheet-date{font-size:12px;color:#7a8497;margin-bottom:14px}.routine-list{border:1px solid #e8ecf2;border-radius:16px;overflow:hidden}.routine{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid #edf0f4}.routine:last-child{border-bottom:0}.routine-name{flex:1;min-width:0}.routine-name strong{display:block;font-size:15px}.routine-name small{display:block;color:#7a8497;font-size:11px;margin-top:3px}.status-dot{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;flex:0 0 31px;font-size:17px;font-weight:850}.pending{background:#fff3bf;color:#b77900}.completed{background:#dff7eb;color:#07945f}.missed{background:#ffe1e1;color:#d92d20}.routine-action{width:31px;height:31px;border-radius:9px;background:#f4f6f9;color:#59657b;font-size:17px}.empty{padding:28px 16px;text-align:center;color:#7a8497;font-size:14px}.legend{display:flex;gap:14px;margin:12px 2px 0;color:#6d7890;font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.legend .yl{background:#f2c94c}.legend .rd{background:#e5484d}.legend .gn{background:#18a870}
@media(max-width:520px){.app{padding:18px 13px 32px}.hero h2{font-size:25px}.cards{gap:10px}.card{padding:14px;border-radius:17px}.person{min-height:157px}.person-name{font-size:17px}.sticker{width:61px;height:61px;font-size:39px;border-radius:20px}.score{font-size:27px}.average-value{font-size:30px}.sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
@media(max-width:360px){.cards{grid-template-columns:1fr}.average{grid-column:auto}}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal" id="routineModal"><section class="sheet"><div class="sheet-head"><div><div class="sheet-title" id="sheetTitle">Routines</div><div class="sheet-date" id="sheetDate"></div></div><button class="close" id="closeModal">×</button></div><div class="routine-list" id="routineList"></div><div class="legend"><span><i class="yl"></i>Pending today</span><span><i class="rd"></i>Missed</span><span><i class="gn"></i>Completed</span></div></section></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),root=document.getElementById('root');
const USERS={Harshit:{email:'harshit@routine.app'},Sapana:{email:'sapana@routine.app'}};
let session=null,profile=null,friendProfile=null,tasks=[],logs=[];
const now=new Date();const today=now.toISOString().slice(0,10);const tenStart=new Date(now);tenStart.setDate(tenStart.getDate()-9);const tenDaysAgo=tenStart.toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
function loginScreen(message=''){root.innerHTML=`<main class="login-wrap"><section class="login"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">Private shared dashboard</p></div></div><div class="card login-card"><label class="field"><span>User ID</span><input id="loginId" autocomplete="username" placeholder="Enter your ID"></label><label class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password"></label><button class="login-btn" id="loginBtn">Log in</button><p id="loginError" class="login-error">${esc(message)}</p><p class="login-help">Two-user private access</p></div></section></main>`;document.getElementById('loginBtn').onclick=login;document.getElementById('loginPassword').onkeydown=e=>{if(e.key==='Enter')login()};}
async function login(){const id=document.getElementById('loginId').value.trim(),password=document.getElementById('loginPassword').value,btn=document.getElementById('loginBtn');if(!USERS[id]){document.getElementById('loginError').textContent='Use Harshit or Sapana as the User ID.';return}if(!password){document.getElementById('loginError').textContent='Enter your password.';return}btn.disabled=true;btn.textContent='Logging in…';const {error}=await supabase.auth.signInWithPassword({email:USERS[id].email,password});if(error){document.getElementById('loginError').textContent='Incorrect User ID or password.';btn.disabled=false;btn.textContent='Log in';return}await init();}
async function init(){const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session){loginScreen();return}renderDashboard();await loadData();}
function renderDashboard(){root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Routine Tracker</h1><p class="date">${fmt(now)}</p></div></div><button class="logout" id="logoutBtn">Log out</button></header><section class="hero"><h2 id="greeting">Good morning! 👋</h2><p>Your shared progress, at a glance.</p></section><section class="cards"><article class="card"><div class="label">Today</div><div class="big">${new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(now)}</div><div class="sub">Daily score snapshot</div></article><article class="card"><div class="label">10-Day Average</div><div class="average-value purple" id="combinedAvg">0%</div><div class="sub">Combined average score</div></article><button class="card person" id="harshitCard"><div class="person-top"><div class="person-name">Harshit</div><span class="you-badge" id="harshitBadge" style="display:none">You</span></div><div class="score-row"><div><div class="score accent" id="harshitScore">0%</div><div class="person-note">Today's score · Tap for routines</div></div><div class="sticker boy">👦🏻</div></div><div class="progress"><div class="fill" id="harshitBar"></div></div></button><button class="card person" id="sapanaCard"><div class="person-top"><div class="person-name">Sapana</div><span class="you-badge" id="sapanaBadge" style="display:none">You</span></div><div class="score-row"><div><div class="score purple" id="sapanaScore">0%</div><div class="person-note">Today's score · Tap for routines</div></div><div class="sticker girl">👧🏻</div></div><div class="progress"><div class="fill friend" id="sapanaBar"></div></div></button><article class="card average"><div class="average-head"><div><div class="label">Last 10 Days Average Score</div><div class="range">${fmt(tenStart)} – ${fmt(now)}</div></div><div style="font-size:27px">📈</div></div><div class="split"><div class="mini"><strong>Harshit</strong><span class="accent" id="harshitAvg">0%</span></div><div class="mini"><strong>Sapana</strong><span class="purple" id="sapanaAvg">0%</span></div></div></article></section><section class="quote"><p>Small steps every day create remarkable results.</p><small>— Keep going. Consistency wins.</small></section><p class="status" id="status"></p></main>`;document.getElementById('logoutBtn').onclick=logout;document.getElementById('harshitCard').onclick=()=>openRoutines('Harshit');document.getElementById('sapanaCard').onclick=()=>openRoutines('Sapana');}
async function logout(){await supabase.auth.signOut();session=null;loginScreen();}
async function loadData(){try{const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();profile=p.data;const myName=profile?.display_name||(session.user.email||'').split('@')[0];document.getElementById('greeting').textContent=`Good morning, ${myName}! 👋`;const m=await supabase.from('friendships').select('user_id,friend_id').or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`).eq('status','accepted');const row=m.data?.[0];const fid=row?(row.user_id===session.user.id?row.friend_id:row.user_id):null;if(fid){const f=await supabase.from('profiles').select('*').eq('id',fid).single();friendProfile=f.data;}const t=await supabase.from('tasks').select('*').order('created_at');tasks=t.data||[];const l=await supabase.from('daily_logs').select('*').gte('log_date',tenDaysAgo).lte('log_date',today);logs=l.data||[];updateScores();markYou();}catch(e){document.getElementById('status').textContent='Unable to load dashboard data.';}}
function markYou(){const e=(session.user.email||'').toLowerCase();if(e==='harshit@routine.app')document.getElementById('harshitBadge').style.display='inline-block';if(e==='sapana@routine.app')document.getElementById('sapanaBadge').style.display='inline-block';}
function personId(name){const e=(session.user.email||'').toLowerCase();if(name==='Harshit'&&e==='harshit@routine.app')return session.user.id;if(name==='Sapana'&&e==='sapana@routine.app')return session.user.id;if(friendProfile?.display_name?.toLowerCase()===name.toLowerCase())return friendProfile.id;return null;}
function applies(t,name){return t.applicable_to==='both'||(name==='Harshit'&&t.applicable_to==='me')||(name==='Sapana'&&t.applicable_to==='friend');}
function score(name,date){const uid=personId(name);const ts=tasks.filter(t=>applies(t,name));if(!uid||!ts.length)return 0;let done=0;for(const t of ts){const l=logs.find(x=>x.task_id===t.id&&x.user_id===uid&&x.log_date===date);if(t.type==='water')done+=Math.min(Number(l?.quantity||0)/Number(t.target_quantity||3000),1);else if(l?.completed)done++;}return Math.round(done/ts.length*100);}
function avg(name){let sum=0;for(let i=0;i<10;i++){const d=new Date(now);d.setDate(d.getDate()-i);sum+=score(name,d.toISOString().slice(0,10));}return Math.round(sum/10);}
function updateScores(){const h=score('Harshit',today),s=score('Sapana',today),ha=avg('Harshit'),sa=avg('Sapana');document.getElementById('harshitScore').textContent=h+'%';document.getElementById('sapanaScore').textContent=s+'%';document.getElementById('harshitBar').style.width=h+'%';document.getElementById('sapanaBar').style.width=s+'%';document.getElementById('harshitAvg').textContent=ha+'%';document.getElementById('sapanaAvg').textContent=sa+'%';document.getElementById('combinedAvg').textContent=Math.round((ha+sa)/2)+'%';}
function openRoutines(name){const modal=document.getElementById('routineModal');document.getElementById('sheetTitle').textContent=`${name}'s Routines`;document.getElementById('sheetDate').textContent=fmt(now);renderRoutineList(name);modal.classList.add('show');}
function renderRoutineList(name){const uid=personId(name),list=document.getElementById('routineList');const ts=tasks.filter(t=>applies(t,name));if(!uid||!ts.length){list.innerHTML='<div class="empty">No routines have been added yet.</div>';return}list.innerHTML='';for(const t of ts){const log=logs.find(x=>x.task_id===t.id&&x.user_id===uid&&x.log_date===today);const done=!!log?.completed;const state=done?'completed':'pending';const row=document.createElement('div');row.className='routine';const dot=document.createElement('span');dot.className=`status-dot ${state}`;dot.textContent=done?'✓':'•';const info=document.createElement('div');info.className='routine-name';info.innerHTML=`<strong>${esc(t.name)}</strong><small>${t.type==='water'?'Water routine':'Routine'} · ${name}</small>`;const action=document.createElement('button');action.className='routine-action';action.textContent=done?'↶':'✓';action.title=done?'Undo':'Mark complete';action.onclick=()=>toggleRoutine(name,t.id,uid,log);row.append(info,dot,action);list.append(row);}}
async function toggleRoutine(name,taskId,uid,log){const completed=!(log?.completed);const r=await supabase.from('daily_logs').upsert({task_id:taskId,user_id:uid,log_date:today,completed,quantity:completed?1:0},{onConflict:'task_id,user_id,log_date'}).select().single();if(r.error){document.getElementById('status').textContent=r.error.message;return}const idx=logs.findIndex(x=>x.task_id===taskId&&x.user_id===uid&&x.log_date===today);if(idx>=0)logs[idx]=r.data;else logs.push(r.data);updateScores();renderRoutineList(name);}
document.getElementById('closeModal').onclick=()=>document.getElementById('routineModal').classList.remove('show');document.getElementById('routineModal').addEventListener('click',e=>{if(e.target.id==='routineModal')e.currentTarget.classList.remove('show')});
init();
</script>
</body>
</html>
